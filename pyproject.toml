[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cambium"
version = "0.1.0"
description = "Middleware between the Resonance Tree lighting simulator and the ESP-NOW lantern fleet — the living layer between wood and bark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "pyserial-asyncio>=0.6",
    "numpy>=2",  # mapping only: Umeyama similarity fit (map align)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cambium = "cambium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cambium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
